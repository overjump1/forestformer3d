# docker compose alternative to scripts/run_offline.sh:
#   docker compose run --rm forestformer3d                # interactive shell
#   docker compose run --rm forestformer3d python tools/test.py \
#       configs/oneformer3d_qs_radius16_qp300_2many.py \
#       work_dirs/clean_forestformer/epoch_3000_fix.pth
services:
  forestformer3d:
    image: forestformer3d:offline
    build: .
    network_mode: none          # runtime is fully offline
    shm_size: '64gb'            # upstream recommends up to 128g for training
    stdin_open: true
    tty: true
    volumes:
      - ./data/ForAINetV2:/workspace/data/ForAINetV2
      - ./work_dirs:/workspace/work_dirs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
